# ============================================================================
# FeatureFlow - GitHub Actions Deployment Workflow
# ============================================================================
# This workflow builds and deploys the application to Azure Container Apps
#
# Triggers:
# - Push to develop branch
# - Manual workflow dispatch
#
# Required GitHub Secrets (in 'develop' environment):
# - AZURE_CREDENTIALS: Service principal credentials (JSON)
# - POSTGRES_CONNECTION_STRING: Database connection string
# - JWT_SECRET: JWT signing key (min 32 chars)
#
# Required GitHub Variables:
# - AZURE_SUBSCRIPTION_ID: Your Azure subscription ID
# - TFSTATE_RESOURCE_GROUP: Resource group containing terraform state storage
# ============================================================================

name: Deploy to Azure

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop

env:
  TERRAFORM_VERSION: '1.5.0'
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '22'
  WORKING_DIRECTORY: './infrastructure/terraform'

jobs:
  # ============================================================================
  # Build Job - Build Docker images for API and Web
  # ============================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    environment: develop
    outputs:
      api_image_tag: ${{ steps.meta-api.outputs.tags }}
      web_image_tag: ${{ steps.meta-web.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Get Terraform outputs
        id: terraform
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"
          echo "acr_name=$(terraform output -raw acr_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "acr_login_server=$(terraform output -raw acr_login_server 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Check if ACR exists
        id: acr_check
        run: |
          if [ -z "${{ steps.terraform.outputs.acr_name }}" ]; then
            echo "acr_exists=false" >> $GITHUB_OUTPUT
            echo "Azure Container Registry name is empty. Ensure Terraform has created the ACR and state before running this workflow."
            exit 1
          else
            echo "acr_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Login to Azure Container Registry
        if: steps.acr_check.outputs.acr_exists == 'true'
        run: az acr login --name ${{ steps.terraform.outputs.acr_name }}

      - name: Set up Docker Buildx
        if: steps.acr_check.outputs.acr_exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata for API
        if: steps.acr_check.outputs.acr_exists == 'true'
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.terraform.outputs.acr_login_server }}/featureflow-api
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Generate image metadata for Web
        if: steps.acr_check.outputs.acr_exists == 'true'
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.terraform.outputs.acr_login_server }}/featureflow-web
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push API image
        if: steps.acr_check.outputs.acr_exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        if: steps.acr_check.outputs.acr_exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://placeholder.azurecontainerapps.io/api/v1

  # ============================================================================
  # Deploy Job - Deploy to Azure Container Apps
  # ============================================================================
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    environment: develop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          TF_VAR_postgres_connection_string: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_environment: dev
          TF_VAR_api_image: ${{ needs.build.outputs.api_image_tag }}
          TF_VAR_web_image: ${{ needs.build.outputs.web_image_tag }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform apply -auto-approve tfplan

      - name: Get deployment URLs
        id: urls
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "web_url=$(terraform output -raw web_url)" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Application URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Web App**: ${{ steps.urls.outputs.web_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: ${{ steps.urls.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Docs**: ${{ steps.urls.outputs.api_url }}/swagger" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: develop" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Health Check Job - Verify deployment
  # ============================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    environment: develop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Get URLs
        id: urls
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "web_url=$(terraform output -raw web_url)" >> $GITHUB_OUTPUT

      - name: Wait for containers to start
        run: sleep 30

      - name: Check API health
        run: |
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.urls.outputs.api_url }}/health" || echo "000")
            if [ "$response" = "200" ]; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Attempt $i: API returned $response, retrying in 10s..."
            sleep 10
          done
          echo "API health check failed"
          exit 1

      - name: Check Web health
        run: |
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.urls.outputs.web_url }}" || echo "000")
            if [ "$response" = "200" ]; then
              echo "Web app is healthy!"
              exit 0
            fi
            echo "Attempt $i: Web returned $response, retrying in 10s..."
            sleep 10
          done
          echo "Web health check failed"
          exit 1
